name: Build & Web-Installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: PlatformIO installieren
        run: pip install --upgrade platformio

      - name: Standard-Einrichtung ins Dateisystem (falls setup/default-setup.json vorhanden)
        run: |
          if [ -f setup/default-setup.json ]; then
            pio run -e esp32 -t buildfs > fs.log 2>&1 || { tail -9 fs.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
            tail -3 fs.log
            # sichern: der folgende Firmware-Build räumt .pio/build auf
            cp .pio/build/esp32/littlefs.bin fs-image.bin
          fi

      - name: Firmware bauen
        run: |
          pio run -e esp32 > build.log 2>&1 || { tail -9 build.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          tail -5 build.log
          if [ -f fs-image.bin ]; then python scripts/append_fs.py fs-image.bin; fi

      - name: Image prüfen (Standard-Einrichtung enthalten?)
        run: |
          pip install -q littlefs-python
          python scripts/verify_image.py .pio/build/esp32/firmware-merged.bin

      - name: Boot-Test im ESP32-Emulator
        run: bash scripts/qemu_boot_test.sh .pio/build/esp32/firmware-merged.bin

      - name: Update-Absicherung im Emulator (Absturz -> Rücksprung)
        run: |
          # Zweite Firmware, die absichtlich abstürzt, in eigenem Build-Ordner
          PLATFORMIO_BUILD_DIR=.pio/crash PLATFORMIO_BUILD_FLAGS=-DLH_CRASH_TEST pio run -e esp32 > crash.log 2>&1 || { tail -9 crash.log | while IFS= read -r l; do echo "::error::$l"; done; exit 1; }
          bash scripts/qemu_rollback_test.sh .pio/build/esp32/firmware-merged.bin .pio/crash/esp32/firmware.bin

      - name: Web-Installer zusammenstellen
        run: |
          VERSION=$(grep -oP 'FW_VERSION\s+"\K[^"]+' src/version.h)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          mkdir -p site/firmware
          cp -r flasher/* site/
          mkdir -p site/app && cp web/index.html site/app/index.html
          cp .pio/build/esp32/firmware-merged.bin site/firmware/liquid-harvest-esp32.bin
          cp .pio/build/esp32/firmware.bin        site/firmware/liquid-harvest-ota.bin
          # Versionsnummer enthält die Standard-Einrichtung -> neue Einrichtung = neue Version im Installer
          MVER="$VERSION"
          if [ -f setup/default-setup.json ]; then MVER="$VERSION+setup.$(sha1sum setup/default-setup.json | cut -c1-7)"; fi
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"$MVER\"/" site/manifest.json
          # Cache-Buster: Browser lädt nach jedem Build garantiert die neue Firmware
          sed -i "s#firmware/liquid-harvest-esp32.bin#firmware/liquid-harvest-esp32.bin?v=${GITHUB_SHA::8}#" site/manifest.json
          cat site/manifest.json
          ls -la site site/firmware

      - name: Anleitung (PDF) erzeugen
        continue-on-error: true
        run: |
          # Laien-Anleitung mit aktuellen Screenshots aus der App – bei jeder Version neu
          npm i --no-save --no-audit --no-fund playwright@1.56.1 > npm.log 2>&1
          npx playwright install --with-deps chromium > pw.log 2>&1
          node docs/anleitung/build.mjs site/anleitung.pdf
          cp site/anleitung.pdf "site/Liquid-Harvest-Anleitung-v$VERSION.pdf"
          echo "::notice title=Anleitung::Liquid-Harvest-Anleitung-v$VERSION.pdf erstellt ($(du -k site/anleitung.pdf | cut -f1) kB)"

      - name: Release für neue Version (Online-Update)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Jede neue FW_VERSION wird automatisch ein Release – daraus holen sich die Geräte ihre Updates
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release v$VERSION gibt es schon"
            # Anleitung nachreichen, falls sie beim Release noch fehlte
            if [ -f "site/Liquid-Harvest-Anleitung-v$VERSION.pdf" ] && ! gh release view "v$VERSION" --json assets -q '.assets[].name' | grep -q Anleitung; then
              gh release upload "v$VERSION" "site/Liquid-Harvest-Anleitung-v$VERSION.pdf"
            fi
          else
            PDF=$(ls site/Liquid-Harvest-Anleitung-v*.pdf 2>/dev/null || true)
            gh release create "v$VERSION" site/firmware/liquid-harvest-ota.bin site/firmware/liquid-harvest-esp32.bin $PDF \
              --target "$GITHUB_SHA" --title "v$VERSION" --generate-notes
            echo "::notice title=Release::v$VERSION veröffentlicht – Geräte bieten das Update an"
          fi

      - name: Online-Update prüfen (Zertifikate, Release-Liste, Download)
        if: github.ref == 'refs/heads/main'
        run: python scripts/check_update_tls.py "v$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: liquid-harvest-${{ env.VERSION }}
          path: site/firmware/*.bin

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: site

      - name: Release (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: site/firmware/*.bin
          generate_release_notes: true

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
